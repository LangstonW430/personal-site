# Netlify reads the build command and publish directory from here rather
# than from autodetection, so a change to either is a reviewable diff.
#
# `publish` is dist, not dist/client. The Astro Netlify adapter writes the
# static assets to dist and the on-demand handler to .netlify/, and Netlify
# resolves the function itself — pointing publish at dist/client serves the
# directory one level too deep and 404s every route.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

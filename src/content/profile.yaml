# The freelance-facing counterpart to githubProfile — recruiters get
# GitHub, prospective clients get this. Same isUnwritten()-gated pattern as
# degree/graduation/etc. below even though it's filled in now, so pulling it
# temporarily is a one-line edit like everything else here.
services: "https://services.langstonwoods.com"

degree: "B.S. Computer Science, AI Concentration; Math Minor"

# The masthead and /contact/ both read this file. Name, role,
# location, institution, and githubProfile are already-established facts
# (CLAUDE.md's own project description; the GitHub account the panel on `/`
# already reads from) — not invented here.
#
# Any field below set to the placeholder sentinel renders as absent, not as
# that text — see src/lib/content.ts, which defines both the sentinel string
# and isUnwritten(). Fill in a real value and it appears; nothing else has to
# change. The literal string is deliberately not repeated here: scripts/
# check-content.mjs greps these files for it and does not skip comments.

name: Langston Woods

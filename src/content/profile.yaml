# Cumulative and major GPA read from the same field — the register's own
# " · " join for a multi-part metadata value (medium.join(' · '), extent's
# "commits · duration"), not a second GPA field. The résumé states the
# overall figure alone; that is the same number, not a disagreement.
gpa: "3.6 overall · 3.9 major"
